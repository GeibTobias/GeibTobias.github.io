<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protected Document</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:#e7e1d4;color:#1d1a15;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate{background:#fffdf8;border-radius:14px;box-shadow:0 18px 50px -24px rgba(0,0,0,.5);
  padding:36px 34px;width:min(400px,100%);text-align:center}
.gate h1{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:.01em}
.gate p{color:rgba(29,26,21,.6);font-size:13.5px;margin-bottom:22px}
.gate .rule{width:48px;height:2px;background:#e8742c;margin:0 auto 22px}
.gate input{width:100%;font-size:15px;font-family:inherit;padding:12px 14px;border:1.5px solid rgba(29,26,21,.2);
  border-radius:9px;background:#fff;color:inherit;outline:none;transition:border-color .2s}
.gate input:focus{border-color:#e8742c}
.gate button{width:100%;margin-top:12px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:13px;
  text-transform:uppercase;letter-spacing:.06em;color:#1a1209;background:#e8742c;border:none;border-radius:9px;
  padding:13px;cursor:pointer;transition:filter .2s}
.gate button:hover{filter:brightness(1.05)}
.gate button:disabled{opacity:.6;cursor:default}
.gate .err{color:#a63b24;font-size:13px;min-height:18px;margin-top:12px;font-weight:600}
</style>
</head>
<body>
<div class="gate">
  <h1>Time Moves On</h1>
  <div class="rule"></div>
  <p>This document is password protected.</p>
  <form id="f">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button id="btn" type="submit">Unlock</button>
    <div class="err" id="err"></div>
  </form>
</div>

const f = document.getElementById('f'), pw = document.getElementById('pw'),
      err = document.getElementById('err'), btn = document.getElementById('btn');

async function unlock(password){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(DATA.salt), iterations:DATA.iter, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(DATA.iv)}, key, b64(DATA.ct));
  return new TextDecoder().decode(pt);
}

f.addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true;
  try {
    const html = await unlock(pw.value);
    document.open(); document.write(html); document.close();
  } catch (_) {
    err.textContent = 'Wrong password.';
    btn.disabled = false;
    pw.value = '';
    pw.focus();
  }
});
