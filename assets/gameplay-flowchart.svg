<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1430" font-family="'Space Grotesk',system-ui,sans-serif" role="img" aria-label="Gameplay flow diagram for one level">
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1d1a15" flood-opacity="0.12"/>
</filter>
<marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d1a15"/>
</marker>
</defs>
<rect x="0" y="0" width="1240" height="1430" rx="18" fill="#fbf6ec"/>
<text x="70" y="60" font-family="'Unbounded','Space Grotesk',system-ui,sans-serif" font-size="30" font-weight="800" fill="#1d1a15">Gameplay Flow &#183; One Level</text>
<text x="70" y="90" font-family="'Space Grotesk',system-ui,sans-serif" font-size="14.5" font-weight="500" fill="#6b6457">From level start to boarding the bus. The clock ticks the whole time, so reaching the Exit late means lost friends.</text>
<rect x="70" y="104" width="56" height="3" rx="1.5" fill="#e8742c"/>
<path d="M 590 158 L 590 207" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 590 293 L 590 344" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 590 476 L 590 770" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 590 770 L 590 914" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 590 1006 L 590 1065" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 590 1215 L 590 1289" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 440 410 L 235 410 L 235 474" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 235 566 L 235 610" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 235 730 L 235 772" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 391 820 L 470 820 L 470 770 L 582 770" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 740 410 L 935 410 L 935 424" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 935 516 L 935 590" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 935 670 L 935 770 L 598 770" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 775 948 L 800 948" fill="none" stroke="#c0492f" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 755 1140 L 823 1140" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 988 1190 L 940 1320 L 776 1320" fill="none" stroke="#1d1a15" stroke-width="2.2" marker-end="url(#arr)" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="590" cy="770" r="7" fill="#1d1a15"/>
<rect x="515" y="586" width="150" height="20" rx="6" fill="#fbf6ec" opacity="0.96"/>
<text x="590" y="600" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#6b6457">Push the direct path</text>
<rect x="348.25" y="346" width="127.5" height="20" rx="6" fill="#fbf6ec" opacity="0.96"/>
<text x="412" y="360" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#6b6457">Explore (deviate)</text>
<rect x="387.5" y="731" width="165" height="20" rx="6" fill="#fbf6ec" opacity="0.96"/>
<text x="470" y="745" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#6b6457">Backtrack to main path</text>
<rect x="729.5" y="346" width="165" height="20" rx="6" fill="#fbf6ec" opacity="0.96"/>
<text x="812" y="360" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#6b6457">Miss a jump (any time)</text>
<rect x="875" y="706" width="120" height="20" rx="6" fill="#fbf6ec" opacity="0.96"/>
<text x="935" y="720" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#6b6457">Rejoin the route</text>
<rect x="838.95" y="934" width="62.1" height="20" rx="6" fill="#fbf6ec" opacity="0.96"/>
<text x="870" y="948" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#c0492f">Timer = 0</text>
<rect x="524.45" y="1231" width="131.1" height="20" rx="6" fill="#fbf6ec" opacity="0.96"/>
<text x="590" y="1245" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#6b6457">1 trinket: same bus</text>
<rect x="754.5" y="1112" width="69" height="20" rx="6" fill="#fbf6ec" opacity="0.96"/>
<text x="789" y="1126" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#6b6457">3 trinkets</text>
<rect x="425" y="102" width="330" height="56" rx="28" fill="#e8742c" stroke="#e8742c" stroke-width="0" filter="url(#sh)"/>
<text x="590" y="130" text-anchor="middle" font-family="'Unbounded','Space Grotesk',system-ui,sans-serif" font-size="16" font-weight="700" fill="#1a1209"><tspan x="590" dy="0">Level begins</tspan></text>
<rect x="415" y="207" width="350" height="86" rx="15" fill="#fffaf0" stroke="#e8742c" stroke-width="2" filter="url(#sh)"/>
<text x="590" y="227" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="11" font-weight="700" fill="#e8742c"><tspan x="590" dy="0">INTRO AREA</tspan></text>
<text x="590" y="249" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15" font-weight="600" fill="#1d1a15"><tspan x="590" dy="0">mandatory skill challenge,</tspan><tspan x="590" dy="18">linear path, high time pressure</tspan></text>
<polygon points="590,344 740,410 590,476 440,410" fill="#efe9ff" stroke="#7b5cff" stroke-width="2" filter="url(#sh)"/>
<text x="590" y="394" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="14" font-weight="700" fill="#1d1a15"><tspan x="590" dy="0">End of the intro:</tspan><tspan x="590" dy="16">push straight</tspan><tspan x="590" dy="16">or explore?</tspan></text>
<rect x="405" y="914" width="370" height="92" rx="15" fill="#fffaf0" stroke="#e8742c" stroke-width="2" filter="url(#sh)"/>
<text x="590" y="934" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="11" font-weight="700" fill="#e8742c"><tspan x="590" dy="0">EXIT AREA</tspan></text>
<text x="590" y="959" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15" font-weight="600" fill="#1d1a15"><tspan x="590" dy="0">a straight race to the bus stop;</tspan><tspan x="590" dy="18">the terrain dissolves as ticks pass</tspan></text>
<polygon points="590,1065 755,1140 590,1215 425,1140" fill="#efe9ff" stroke="#7b5cff" stroke-width="2" filter="url(#sh)"/>
<text x="590" y="1116" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="14" font-weight="700" fill="#1d1a15"><tspan x="590" dy="0">At the bus stop,</tspan><tspan x="590" dy="16">how many bus</tspan><tspan x="590" dy="16">trinkets do</tspan><tspan x="590" dy="16">you hold?</tspan></text>
<rect x="404" y="1289" width="372" height="62" rx="31" fill="#e8742c" stroke="#e8742c" stroke-width="0" filter="url(#sh)"/>
<text x="590" y="1320" text-anchor="middle" font-family="'Unbounded','Space Grotesk',system-ui,sans-serif" font-size="15" font-weight="700" fill="#1a1209"><tspan x="590" dy="0">Board the bus  →  next level or exam</tspan></text>
<rect x="79" y="474" width="312" height="92" rx="15" fill="#fffaf0" stroke="#e8742c" stroke-width="2" filter="url(#sh)"/>
<text x="235" y="494" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="11" font-weight="700" fill="#e8742c"><tspan x="235" dy="0">EXPLORATION AREA  (optional)</tspan></text>
<text x="235" y="519" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15" font-weight="600" fill="#1d1a15"><tspan x="235" dy="0">grab gold and items, recruit</tspan><tspan x="235" dy="18">friends (1 friendship item each)</tspan></text>
<polygon points="235,610 370,670 235,730 100,670" fill="#efe9ff" stroke="#7b5cff" stroke-width="2" filter="url(#sh)"/>
<text x="235" y="646" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="14" font-weight="700" fill="#1d1a15"><tspan x="235" dy="0">An obelisk gates</tspan><tspan x="235" dy="16">a reward.</tspan><tspan x="235" dy="16">Pay 50 mana or</tspan><tspan x="235" dy="16">parry through?</tspan></text>
<rect x="79" y="772" width="312" height="96" rx="15" fill="#eaf5e2" stroke="#3f9e52" stroke-width="2" filter="url(#sh)"/>
<text x="235" y="792" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="11" font-weight="700" fill="#3f9e52"><tspan x="235" dy="0">REWARD</tspan></text>
<text x="235" y="819" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15" font-weight="600" fill="#1d1a15"><tspan x="235" dy="0">unlock a friend, a bus trinket,</tspan><tspan x="235" dy="18">or an hourglass (+10s)</tspan></text>
<rect x="785" y="424" width="300" height="92" rx="15" fill="#fffaf0" stroke="#e8742c" stroke-width="2" filter="url(#sh)"/>
<text x="935" y="444" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="11" font-weight="700" fill="#e8742c"><tspan x="935" dy="0">MISSED A JUMP</tspan></text>
<text x="935" y="469" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15" font-weight="600" fill="#1d1a15"><tspan x="935" dy="0">miss a jump and you drop to</tspan><tspan x="935" dy="18">a lower alternate route</tspan></text>
<rect x="785" y="590" width="300" height="80" rx="15" fill="#fffaf0" stroke="#e8742c" stroke-width="2" filter="url(#sh)"/>
<text x="935" y="621" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15" font-weight="600" fill="#1d1a15"><tspan x="935" dy="0">backtrack up,</tspan><tspan x="935" dy="18">or ride it forward</tspan></text>
<rect x="800" y="908" width="330" height="104" rx="15" fill="#fbe9e3" stroke="#c0492f" stroke-width="2" filter="url(#sh)"/>
<text x="965" y="928" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="11" font-weight="700" fill="#c0492f"><tspan x="965" dy="0">IF TIME RUNS OUT</tspan></text>
<text x="965" y="950" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15" font-weight="600" fill="#8f2f1c"><tspan x="965" dy="0">the bus leaves without you:</tspan><tspan x="965" dy="18">slow friends stay behind,</tspan><tspan x="965" dy="18">Level-2 friends are lost</tspan></text>
<rect x="823" y="1090" width="330" height="100" rx="15" fill="#fffaf0" stroke="#e8742c" stroke-width="2" filter="url(#sh)"/>
<text x="988" y="1110" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="11" font-weight="700" fill="#e8742c"><tspan x="988" dy="0">PATH CHOICE</tspan></text>
<text x="988" y="1139" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15" font-weight="600" fill="#1d1a15"><tspan x="988" dy="0">choose one of two school buses;</tspan><tspan x="988" dy="18">the party splits by school loyalty</tspan></text>
<rect x="905" y="150" width="300" height="176" rx="14" fill="#ffffff" stroke="rgba(29,26,21,.14)" stroke-width="1.5"/>
<text x="923" y="176" text-anchor="start" font-family="'Unbounded','Space Grotesk',system-ui,sans-serif" font-size="14" font-weight="700" fill="#1d1a15"><tspan x="923" dy="0">Legend</tspan></text>
<rect x="917" y="195" width="44" height="22" rx="11" fill="#e8742c" stroke="#e8742c" stroke-width="0" filter="url(#sh)"/>
<text x="983" y="206" text-anchor="start" font-family="'Space Grotesk',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1d1a15"><tspan x="983" dy="0">Start / end</tspan></text>
<rect x="917" y="224" width="44" height="24" rx="6" fill="#fffaf0" stroke="#e8742c" stroke-width="2"/>
<text x="983" y="236" text-anchor="start" font-family="'Space Grotesk',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1d1a15"><tspan x="983" dy="0">Area / action</tspan></text>
<polygon points="939,253 963,266 939,279 915,266" fill="#efe9ff" stroke="#7b5cff" stroke-width="2"/>
<text x="983" y="266" text-anchor="start" font-family="'Space Grotesk',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1d1a15"><tspan x="983" dy="0">Decision</tspan></text>
<rect x="917" y="284" width="44" height="24" rx="6" fill="#eaf5e2" stroke="#3f9e52" stroke-width="2"/>
<text x="983" y="296" text-anchor="start" font-family="'Space Grotesk',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#1d1a15"><tspan x="983" dy="0">Reward</tspan></text>
<text x="923" y="320" font-family="'Space Grotesk',system-ui,sans-serif" font-size="11" fill="#6b6457">Red dashed = time hazard</text>
</svg>
